<!DOCTYPE html>
<html>
<head>
    <title>Register - Student Study Portal</title>
</head>
<body>
    <h2>Create a New Student Account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
</body>
</html>
