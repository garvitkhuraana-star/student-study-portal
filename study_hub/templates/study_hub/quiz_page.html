<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"></head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-primary">{{ quiz.name }}</h2>
        <form method="POST">
            {% csrf_token %}
            {% for q in questions %}
            <div class="card mb-3 p-3 shadow-sm">
                <p><strong>{{ q.content }}</strong></p>
                {% for choice in q.choices.all %}
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="{{ choice.id }}" required>
                    <label class="form-check-label">{{ choice.text }}</label>
                </div>
                {% endfor %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-success btn-lg">Submit Quiz</button>
        </form>
    </div>
</body>
</html>
